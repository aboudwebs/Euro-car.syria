name: Build EURO CARS APK (main)
# Release validation includes unified Firebase authentication and SMS phone verification.
# Covers the unified Firebase sign-in flow and the read-only guest catalog.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/firebase-push-notifications
    paths:
      - '**.dart'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'branding/**'
      - 'tool/**'
      - '.github/workflows/build-design-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**.dart'
      - 'test/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - 'branding/**'
      - 'tool/**'

permissions:
  contents: write

concurrency:
  group: euro-cars-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.eurocars --project-name euro_cars .

      - name: Configure permanent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = ("ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing required GitHub Actions secrets: " + ", ".join(missing))

          keystore = Path("android/app/euro-cars-release.jks")
          keystore.parent.mkdir(parents=True, exist_ok=True)
          try:
              data = base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True)
          except Exception as exc:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is not valid Base64") from exc
          if not data:
              raise SystemExit("Decoded keystore is empty")
          keystore.write_bytes(data)

          def escape_property(value):
              value = value.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r").replace("\t", "\\t")
              for char in ("\\", ":", "=", "#", "!"):
                  value = value.replace(char, "\\" + char)
              if value.startswith(" "):
                  value = "\\" + value
              return value

          properties = {
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "storeFile": "euro-cars-release.jks",
          }
          Path("android/key.properties").write_text(
              "".join(f"{key}={escape_property(value)}\n" for key, value in properties.items()),
              encoding="utf-8",
          )
          print("Release signing keystore configured.")
          PY

      - name: Prepare Android configuration and icons
        run: python3 tool/prepare_android.py

      - name: Configure R8 for optional ML Kit OCR scripts
        run: python3 tool/configure_mlkit_r8.py

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build release APK (ARM32 + ARM64)
        run: flutter build apk --release --target-platform android-arm,android-arm64 --dart-define=EURO_API_URL=https://control-panel-euro-cars.onrender.com --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}

      - name: Verify APK
        run: bash tool/verify_apk.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Publish permanent APK download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: EURO CARS — Latest Android APK
          body: Latest verified EURO CARS Android APK (ARM32 + ARM64).
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: euro-cars-main-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
            build/app/outputs/flutter-apk/app-release.apk.verification.txt
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          echo "### EURO CARS — main" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "APK size: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          fi
