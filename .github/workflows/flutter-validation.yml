name: Flutter validation (no APK)

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: euro-parts-flutter-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9 # last version that passed CI; bump on purpose after checking `flutter analyze`
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Tests
        run: flutter test --no-pub
      - name: Generate Android project
        run: flutter create --platforms=android --org com.eurocars --project-name euro_cars .
      - name: Prepare Android configuration
        run: python3 tool/prepare_android.py
      - name: Configure R8 for optional ML Kit OCR scripts
        run: python3 tool/configure_mlkit_r8.py
      - name: Android release build
        run: flutter build apk --release --no-pub --target-platform android-arm,android-arm64 --dart-define=EURO_API_URL=https://control-panel-euro-cars.onrender.com

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Generate Web project
        run: flutter create --platforms=web .
      - name: Prepare EURO PWA branding and iPhone metadata
        run: |
          python3 -m venv .venv-web
          .venv-web/bin/pip install Pillow
          .venv-web/bin/python tool/prepare_web.py
      - name: Get dependencies
        run: flutter pub get
      - name: Flutter Web release build
        env:
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_AUTH_DOMAIN: ${{ vars.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_PROJECT_ID: ${{ vars.FIREBASE_WEB_PROJECT_ID }}
          FIREBASE_WEB_STORAGE_BUCKET: ${{ vars.FIREBASE_WEB_STORAGE_BUCKET }}
        run: |
          flutter build web --release --no-pub --base-href /app/ \
            --dart-define=FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY" \
            --dart-define=FIREBASE_WEB_APP_ID="$FIREBASE_WEB_APP_ID" \
            --dart-define=FIREBASE_WEB_AUTH_DOMAIN="$FIREBASE_WEB_AUTH_DOMAIN" \
            --dart-define=FIREBASE_WEB_MESSAGING_SENDER_ID="$FIREBASE_WEB_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_WEB_PROJECT_ID="$FIREBASE_WEB_PROJECT_ID" \
            --dart-define=FIREBASE_WEB_STORAGE_BUCKET="$FIREBASE_WEB_STORAGE_BUCKET"
      - name: Upload installable web build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: euro-parts-pwa-web
          path: build/web/
          if-no-files-found: error
          retention-days: 3
