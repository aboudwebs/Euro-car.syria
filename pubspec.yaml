name: euro_cars
description: EURO CARS native spare-parts app for workshops and marketers
publish_to: "none"
version: 1.1.1+67

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  # On-device text recognition for the VIN camera search (no network, no account; Latin script).
  google_mlkit_text_recognition: ^0.15.0
  # Original Instagram / TikTok brand icons for the About page.
  font_awesome_flutter: ^11.0.0
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Tajawal (SIL Open Font License 1.1, see assets/fonts/OFL.txt) - the same Arabic family the web app uses.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
