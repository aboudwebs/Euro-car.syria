name: Flutter validation (no APK)

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9 # last version that passed CI; bump on purpose after checking `flutter analyze`
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Tests
        run: flutter test --no-pub
      - name: Generate Android project
        run: flutter create --platforms=android --org com.eurocars --project-name euro_cars .
      - name: Prepare Android configuration
        run: python3 tool/prepare_android.py
      - name: Configure R8 for optional ML Kit OCR scripts
        run: python3 tool/configure_mlkit_r8.py
      - name: Android release build
        run: flutter build apk --release --no-pub --target-platform android-arm,android-arm64 --dart-define=EURO_API_URL=https://control-panel-euro-cars.onrender.com

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Generate Web project
        run: flutter create --platforms=web .
      - name: Get dependencies
        run: flutter pub get
      - name: Flutter Web release build
        run: flutter build web --release --no-pub
