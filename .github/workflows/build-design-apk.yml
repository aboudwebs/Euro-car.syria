name: Build EURO CARS APK (Google Play AAB is manual)
# Release validation includes unified Firebase authentication, MsgPlus SMS verification and the read-only guest catalog.

on:
  workflow_dispatch:
    inputs:
      build_play_bundle:
        description: 'Build the signed Google Play AAB (only after final audit)'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - '**.dart'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'branding/**'
      - 'tool/**'
      - '.github/workflows/build-design-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**.dart'
      - 'test/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - 'branding/**'
      - 'tool/**'

# The build runs third-party actions and project scripts, so its token is read-only. Only the small `publish` job at
# the end can write releases, and it runs no project code (it only downloads the verified artifact).
permissions:
  contents: read

concurrency:
  group: euro-cars-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install ELF inspection tools
        run: sudo apt-get update && sudo apt-get install -y binutils

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9 # last version that passed CI; bump on purpose after checking `flutter analyze`
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.eurocars --project-name euro_cars .

      - name: Configure permanent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = ("ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing required GitHub Actions secrets: " + ", ".join(missing))

          keystore = Path("android/app/euro-cars-release.jks")
          keystore.parent.mkdir(parents=True, exist_ok=True)
          try:
              data = base64.b64decode("".join(os.environ["ANDROID_KEYSTORE_BASE64"].split()), validate=True)
          except Exception as exc:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is not valid Base64") from exc
          if not data:
              raise SystemExit("Decoded keystore is empty")
          keystore.write_bytes(data)

          def escape_property(value):
              value = value.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r").replace("\t", "\\t")
              for char in ("\\", ":", "=", "#", "!"):
                  value = value.replace(char, "\\" + char)
              if value.startswith(" "):
                  value = "\\" + value
              return value

          properties = {
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "storeFile": "euro-cars-release.jks",
          }
          Path("android/key.properties").write_text(
              "".join(f"{key}={escape_property(value)}\n" for key, value in properties.items()),
              encoding="utf-8",
          )
          print("Release signing keystore configured.")
          PY

      - name: Prepare Android configuration and icons
        run: python3 tool/prepare_android.py --require-release-signing

      - name: Configure R8 for optional ML Kit OCR scripts
        run: python3 tool/configure_mlkit_r8.py

      - name: Validate Google OAuth Web client configuration
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          configured = os.environ.get("GOOGLE_SERVER_CLIENT_ID", "").strip()
          if not configured:
              raise SystemExit("Missing repository variable GOOGLE_SERVER_CLIENT_ID (Firebase Web OAuth client ID).")
          config = json.loads(Path("firebase/google-services.json").read_text(encoding="utf-8"))
          web_clients = {
              item.get("client_id")
              for client in config.get("client", [])
              for item in client.get("oauth_client", [])
              if item.get("client_type") == 3
          }
          if configured not in web_clients:
              raise SystemExit("GOOGLE_SERVER_CLIENT_ID does not match a Web OAuth client in firebase/google-services.json.")
          print("Google OAuth Web client ID is present and matches Firebase Android configuration.")
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build release APK (ARM32 + ARM64)
        run: flutter build apk --release --target-platform android-arm,android-arm64 --dart-define=EURO_API_URL=https://control-panel-euro-cars.onrender.com --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}

      # ELF PT_LOAD 16 KB alignment applies to arm64-v8a/x86_64; ZIP alignment is checked for every packaged ABI.
      - name: Verify APK
        run: bash tool/verify_apk.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Verify release upload certificate fingerprint
        env:
          EXPECTED_UPLOAD_CERT_SHA256: A7E183D1F02AB3D5D48F6C0067F864DCBEAA5130A35F8F50F52EF1DC458CED1E
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          apksigner="$(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          output="$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          actual="$(printf '%s\\n' "$output" | awk 'tolower($0) ~ /certificate sha-256 digest:/ { sub(/^.*digest:[[:space:]]*/, ""); gsub(/:/, ""); gsub(/[[:space:]]/, ""); print toupper($0); exit }')"
          if [ "$actual" != "$EXPECTED_UPLOAD_CERT_SHA256" ]; then
            echo "Release APK signer does not match the configured EURO upload certificate." >&2
            echo "Expected SHA-256: $EXPECTED_UPLOAD_CERT_SHA256" >&2
            echo "Actual SHA-256: ${actual:-unavailable}" >&2
            exit 1
          fi
          echo "PASS: release APK signer matches the configured EURO upload certificate ($actual)."

      - name: Build signed AAB for Google Play (final package)
        if: (github.event_name == 'workflow_dispatch' && inputs.build_play_bundle) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[EURO-PLAY-AAB-ONCE]'))
        run: flutter build appbundle --release --target-platform android-arm,android-arm64 --dart-define=EURO_API_URL=https://control-panel-euro-cars.onrender.com --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}

      - name: Verify signed AAB and APK generated from the bundle
        if: (github.event_name == 'workflow_dispatch' && inputs.build_play_bundle) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[EURO-PLAY-AAB-ONCE]'))
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -tq "$AAB"
          jarsigner -verify -verbose -certs "$AAB" > /tmp/euro-aab-signature.txt 2>&1
          grep -qi "jar verified" /tmp/euro-aab-signature.txt
          keytool -printcert -jarfile "$AAB" > "$AAB.certificate.txt"
          # Match the local EURO upload keystore; verify this same fingerprint in Play Console before upload.
          expected_upload_cert_sha256="A7E183D1F02AB3D5D48F6C0067F864DCBEAA5130A35F8F50F52EF1DC458CED1E"
          actual_upload_cert_sha256="$(awk '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}' "$AAB.certificate.txt")"
          if [ "$actual_upload_cert_sha256" != "$expected_upload_cert_sha256" ]; then
            echo "AAB signer certificate does not match the EURO upload keystore." >&2
            echo "Expected SHA-256: $expected_upload_cert_sha256" >&2
            echo "Actual SHA-256: ${actual_upload_cert_sha256:-unavailable}" >&2
            exit 1
          fi

          curl -fsSL "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" -o /tmp/bundletool.jar
          java -jar /tmp/bundletool.jar validate --bundle="$AAB"
          manifest="$(java -jar /tmp/bundletool.jar dump manifest --bundle="$AAB" --module=base)"
          printf '%s\n' "$manifest" > "$AAB.manifest.xml"
          printf '%s\n' "$manifest" | grep -Eq 'targetSdkVersion="36"' || {
            echo "AAB manifest does not target Android API 36" >&2
            exit 1
          }

          java -jar /tmp/bundletool.jar build-apks \
            --bundle="$AAB" \
            --output=/tmp/euro-cars-from-aab.apks \
            --mode=universal \
            --ks=android/app/euro-cars-release.jks \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --ks-pass="pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass="pass:$ANDROID_KEY_PASSWORD" \
            --overwrite
          unzip -p /tmp/euro-cars-from-aab.apks universal.apk > /tmp/euro-cars-from-aab.apk
          bash tool/verify_apk.sh /tmp/euro-cars-from-aab.apk

          sha256sum "$AAB" > "$AAB.sha256"
          {
            echo "AAB archive, signature and bundletool validation: PASS"
            echo "Target SDK: 36"
            echo "Upload certificate SHA-256: $actual_upload_cert_sha256"
            echo "SHA-256: $(sha256sum "$AAB" | cut -d ' ' -f 1)"
            echo "Universal APK extracted from the AAB passed tool/verify_apk.sh."
            cat /tmp/euro-aab-signature.txt
          } > "$AAB.verification.txt"

      - name: Upload Google Play AAB artifact
        if: (github.event_name == 'workflow_dispatch' && inputs.build_play_bundle) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[EURO-PLAY-AAB-ONCE]'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: euro-cars-play-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
            build/app/outputs/bundle/release/app-release.aab.certificate.txt
            build/app/outputs/bundle/release/app-release.aab.manifest.xml
            build/app/outputs/bundle/release/app-release.aab.verification.txt
          if-no-files-found: error
          retention-days: 14


      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: euro-cars-main-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
            build/app/outputs/flutter-apk/app-release.apk.verification.txt
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          echo "### EURO CARS — main" >> "$GITHUB_STEP_SUMMARY"
          apk="build/app/outputs/flutter-apk/app-release.apk"
          if [ -s "$apk" ]; then
            echo "APK size: $(stat -c %s "$apk") bytes ($(du -h "$apk" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
            echo "SHA-256: $(sha256sum "$apk" | cut -d ' ' -f 1)" >> "$GITHUB_STEP_SUMMARY"
            echo "Installable APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/mobile-latest/app-release.apk" >> "$GITHUB_STEP_SUMMARY"
            echo "Note: the Actions artifact is a ZIP container; install the standalone app-release.apk from the release." >> "$GITHUB_STEP_SUMMARY"
          fi
          aab="build/app/outputs/bundle/release/app-release.aab"
          if [ -s "$aab" ]; then
            echo "Google Play AAB size: $(stat -c %s "$aab") bytes" >> "$GITHUB_STEP_SUMMARY"
            echo "AAB SHA-256: $(sha256sum "$aab" | cut -d ' ' -f 1)" >> "$GITHUB_STEP_SUMMARY"
            echo "Signed AAB artifact: euro-cars-play-aab" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish permanent APK download
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the verified APK files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: euro-cars-main-apk
          path: release-files

      - name: Publish permanent APK download
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: mobile-latest
          name: EURO CARS — Latest Android APK
          body: |
            Verified standalone EURO CARS Android APK (ARM32 + ARM64).
            Download app-release.apk below to install. Do not use the Actions artifact ZIP as the installer.
            The SHA-256 checksum and full verification report are attached.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-files/app-release.apk
            release-files/app-release.apk.sha256
            release-files/app-release.apk.verification.txt
